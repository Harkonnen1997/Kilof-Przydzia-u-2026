
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kilof Przydziału</title>
  <style>
    @font-face {
      font-family: 'Gothic';
      src: url('gothic.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Minecraft';
      src: url('minecraft.ttf') format('truetype');
    }

    body {
      margin: 0;
      padding: 0;
      background-image: url('background.jpg');
      background-size: cover;
      font-family: 'Gothic', serif;
      color: #fff;
      text-align: center;
    }

    h1 {
      font-size: 4em;
      margin-top: 1em;
      font-family: 'Minecraft', monospace;
      color: #ffe600;
      text-shadow: 2px 2px 2px #000;
    }

    .selection-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 1em;
    }

    input, button {
      padding: 10px;
      font-size: 1.2em;
      font-family: 'Gothic', serif;
    }

    #result {
      margin-top: 2em;
      font-size: 1.5em;
      background: rgba(0, 0, 0, 0.6);
      display: inline-block;
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Kilof Przydziału</h1>

  <div class="selection-container">
    <button onclick="resetSelection()">Wróć</button>
    <label for="playerInput">Wpisz swoje imię:</label>
    <input list="nameSuggestions" id="playerInput" name="playerInput" placeholder="np. Olga">
    <datalist id="nameSuggestions"></datalist>
  </div>

  <div id="result"></div>

  <script>
    const data = {
      "1": {
        czlonkowie: ["Chudy", "Erol", "Galm", "Grzebor", "Isa", "Iskra", "Latro", "Łajza", "Skaza", "Zek"]
      },
      "2": {
        czlonkowie: ["Darnok", "Duży", "Krótki Josif", "Kwasik", "Leonardo", "Maruda", "Melgen", "Merik", "Ravill", "Rosa"]
      },
      "3": {
        czlonkowie: ["Anilis", "Benek", "Cykuta", "Morian", "Pocak", "Rez", "Rudzik", "Sójka"]
      },
      "4": {
        czlonkowie: ["Bercik", "Borek", "Cespenar", "Dodo", "Gierałt", "Jopke", "Knaga", "Neralis", "Szczery", "Teodor"]
      },
      "6": {
        czlonkowie: ["Barett", "Genowefa", "Ligon", "Rudy Faja", "Sarniak", "Smalec Faja", "Talla", "Tipp", "Valerian", "Wilgo", "Yarem"]
      }
    };

    const input = document.getElementById('playerInput');
    const resultDiv = document.getElementById('result');
    const datalist = document.getElementById('nameSuggestions');

    const allNames = [];
    Object.entries(data).forEach(([brygada, info]) => {
      info.czlonkowie.forEach(name => {
        allNames.push(name);
        const opt = document.createElement('option');
        opt.value = name;
        datalist.appendChild(opt);
      });
    });

    function resetSelection() {
      input.value = "";
      resultDiv.innerHTML = "";
    }

    input.addEventListener('change', function() {
      const name = this.value;
      if (!name || !allNames.includes(name)) return;

      const { brygada, czlonkowie } = findPlayer(name);
      showRealData(name, brygada, czlonkowie);
    });

    function findPlayer(name) {
      for (const [brygada, info] of Object.entries(data)) {
        if (info.czlonkowie.includes(name)) {
          return {
            brygada,
            czlonkowie: info.czlonkowie.filter(n => n !== name)
          };
        }
      }
      return {};
    }

    function showRealData(name, brygada, czlonkowie) {
      let result = `<p>W tym kwartale pracować będziesz w Brygadzie ${brygada}.</p>`;
      result += `<p>Inni członkowie Twojej Brygady to: ${czlonkowie.join(", ")}.</p>`;
      resultDiv.innerHTML = result;
    }
  </script>
</body>
</html>
