
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kilof Przydziału</title>
  <style>
    @font-face {
      font-family: 'Gothic';
      src: url('gothic.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Minecraft';
      src: url('minecraft.ttf') format('truetype');
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 16px;
      min-height: 100vh;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Gothic', serif;
      color: #fff;
      text-align: center;
    }

    h1 {
      font-size: 4em;
      margin-top: 1em;
      font-family: 'Minecraft', monospace;
      color: #ffe600;
      text-shadow: 2px 2px 2px #000;
    }

    .selection-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 1em;
    }

    .input-wrapper {
      position: relative;
      width: 260px;
      max-width: 90vw;
    }

    input, button {
      padding: 10px;
      font-size: 1.2em;
      font-family: 'Gothic', serif;
    }

    #playerInput {
      width: 100%;
    }

    #suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #ffe600;
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 5;
      text-align: left;
      display: none;
    }

    #suggestions div {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 1em;
    }

    #suggestions div:hover,
    #suggestions div.active {
      background: rgba(255, 230, 0, 0.25);
    }

    #result {
      margin-top: 2em;
      font-size: 1.5em;
      background: rgba(0, 0, 0, 0.6);
      display: inline-block;
      padding: 20px;
      border-radius: 10px;
      max-width: 90vw;
    }

    @media (max-width: 600px) {
      body {
        padding: 0 10px;
      }

      h1 {
        font-size: 2.2em;
        margin-top: 0.8em;
      }

      .selection-container {
        flex-direction: column;
      }

      input, button {
        font-size: 1em;
      }

      #result {
        font-size: 1.1em;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <h1>Kilof Przydziału</h1>

  <div class="selection-container">
    <button onclick="resetSelection()">Wróć</button>
    <label for="playerInput">Wpisz swoje imię:</label>
    <div class="input-wrapper">
      <input type="text" id="playerInput" name="playerInput" placeholder="np. Olga" autocomplete="off">
      <div id="suggestions"></div>
    </div>
  </div>

  <div id="result"></div>

  <script>
    const data = {
      "1": {
        czlonkowie: ["Chudy", "Erol", "Galm", "Grzebor", "Iskra", "Latro", "Łajza", "Skaza", "Zek"]
      },
      "2": {
        czlonkowie: ["Darnok", "Duży", "Krótki Josif", "Kwasik", "Leonardo", "Maruda", "Melgen", "Merik", "Ravill", "Rosa"]
      },
      "3": {
        czlonkowie: ["Anilis", "Benek", "Cykuta", "Morian", "Pocak", "Rez", "Rudzik", "Sójka"]
      },
      "4": {
        czlonkowie: ["Bercik", "Borek", "Cespenar", "Dodo", "Gierałt", "Jopke", "Kati", "Knaga", "Neralis", "Szczery", "Teodor"]
      },
      "6": {
        czlonkowie: ["Barett", "Genowefa", "Ligon", "Rudy Faja", "Sarniak", "Smalec Faja", "Talla", "Tipp", "Valerian", "Wilgo", "Yarem"]
      }
    };

    const input = document.getElementById('playerInput');
    const resultDiv = document.getElementById('result');
    const suggestionsBox = document.getElementById('suggestions');

    const allNames = [];
    Object.values(data).forEach(info => {
      info.czlonkowie.forEach(name => allNames.push(name));
    });

    let activeIndex = -1;

    function resetSelection() {
      input.value = "";
      resultDiv.innerHTML = "";
      hideSuggestions();
    }

    function hideSuggestions() {
      suggestionsBox.style.display = 'none';
      suggestionsBox.innerHTML = '';
      activeIndex = -1;
    }

    function renderSuggestions(matches) {
      suggestionsBox.innerHTML = '';
      if (matches.length === 0) {
        hideSuggestions();
        return;
      }
      matches.forEach(name => {
        const div = document.createElement('div');
        div.textContent = name;
        div.addEventListener('mousedown', (e) => {
          e.preventDefault();
          selectName(name);
        });
        suggestionsBox.appendChild(div);
      });
      suggestionsBox.style.display = 'block';
      activeIndex = -1;
    }

    function selectName(name) {
      input.value = name;
      hideSuggestions();
      handleSelection(name);
    }

    input.addEventListener('input', function() {
      const query = this.value.trim().toLowerCase();
      if (!query) {
        hideSuggestions();
        return;
      }
      const matches = allNames.filter(n => n.toLowerCase().includes(query));
      renderSuggestions(matches);
    });

    input.addEventListener('keydown', function(e) {
      const items = Array.from(suggestionsBox.children);
      if (items.length === 0) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = (activeIndex + 1) % items.length;
        updateActive(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = (activeIndex - 1 + items.length) % items.length;
        updateActive(items);
      } else if (e.key === 'Enter') {
        if (activeIndex >= 0) {
          e.preventDefault();
          selectName(items[activeIndex].textContent);
        } else if (allNames.includes(this.value)) {
          hideSuggestions();
          handleSelection(this.value);
        }
      } else if (e.key === 'Escape') {
        hideSuggestions();
      }
    });

    function updateActive(items) {
      items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.input-wrapper')) {
        hideSuggestions();
      }
    });

    function handleSelection(name) {
      if (!allNames.includes(name)) return;
      const { brygada, czlonkowie } = findPlayer(name);
      showRealData(name, brygada, czlonkowie);
    }

    function findPlayer(name) {
      for (const [brygada, info] of Object.entries(data)) {
        if (info.czlonkowie.includes(name)) {
          return {
            brygada,
            czlonkowie: info.czlonkowie.filter(n => n !== name)
          };
        }
      }
      return {};
    }

    function showRealData(name, brygada, czlonkowie) {
      let result = `<p>W tym kwartale pracować będziesz w Brygadzie ${brygada}.</p>`;
      result += `<p>Inni członkowie Twojej Brygady to: ${czlonkowie.join(", ")}.</p>`;
      resultDiv.innerHTML = result;
    }
  </script>
</body>
</html>
